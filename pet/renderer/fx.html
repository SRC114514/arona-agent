<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
    }
    /* 全屏特效画布：不拦截鼠标（manual 输入 + 主进程穿透），透明背景 */
    #fx {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="fx"></div>
  <script src="../../node_modules/ba-click-fx/dist/ba-click-fx.iife.js"></script>
  <script src="fx.js"></script>
</body>
</html>
